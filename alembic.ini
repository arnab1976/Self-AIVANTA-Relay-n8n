# Schema migrations. Development uses SQLAlchemy create_all at startup; staging/prod should use Alembic:
#   alembic revision --autogenerate -m "initial"   (reads DATABASE_URL)
#   alembic upgrade head
[alembic]
script_location = apps/api/migrations
prepend_sys_path = apps/api

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
