# AIVANTA Relay — local production-like stack
#   cp .env.example .env            # set AIVANTA_BRIDGE_TOKEN and N8N_ENCRYPTION_KEY
#   docker compose up -d --build db n8n-db redis n8n n8n-worker
#   python scripts/n8n_bootstrap.py --n8n http://localhost:5678 --email ops@example.com --password '<pw>' --write-env .env
#   docker compose up -d --build api worker web
#
#   Web     http://localhost:3000      AIVANTA portal
#   API     http://localhost:8000/docs
#   n8n     http://localhost:5678      editor (platform team only; tenants never sign in to n8n)
x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: n8n-db
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: n8n
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-with-a-32-char-random-key!!}
  N8N_HOST: localhost
  N8N_PORT: "5678"
  N8N_PROTOCOL: http
  N8N_EDITOR_BASE_URL: http://localhost:5678
  # resume URLs ($execution.resumeUrl) are built from WEBHOOK_URL; the API calls them on the private network
  WEBHOOK_URL: http://n8n:5678/
  N8N_PUBLIC_API_DISABLED: "false"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_SECURE_COOKIE: "false"            # local http only; remove behind TLS
  N8N_RUNNERS_ENABLED: "true"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"
  GENERIC_TIMEZONE: UTC
  NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh","n8n-nodes-base.readWriteFile"]'

services:
  db:                                   # AIVANTA database (tenants, runs, artifacts, audit, pgvector)
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: aivanta, POSTGRES_USER: aivanta, POSTGRES_PASSWORD: aivanta }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aivanta"], interval: 5s, retries: 10 }

  n8n-db:                               # n8n's own database (workflows, encrypted credentials, executions)
    image: postgres:16-alpine
    environment: { POSTGRES_DB: n8n, POSTGRES_USER: n8n, POSTGRES_PASSWORD: n8n }
    volumes: [n8ndata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U n8n"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  n8n:                                  # main: editor, public API, webhooks
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-2.45.7}
    environment: *n8n-env
    ports: ["5678:5678"]
    volumes: [n8nhome:/home/node/.n8n]
    depends_on: { n8n-db: { condition: service_healthy }, redis: { condition: service_healthy } }

  n8n-worker:                           # executes workflows from the Redis queue; scale with --scale n8n-worker=N
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-2.45.7}
    command: worker
    environment: *n8n-env
    depends_on: [n8n]

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aivanta:aivanta@db:5432/aivanta
      STORAGE_DIR: /data/objects
      RUN_EXECUTION: worker
      CORS_ORIGINS: http://localhost:3000
      N8N_MODE: rest
      N8N_API_URL: http://n8n:5678/api/v1
      N8N_WEBHOOK_URL: http://n8n:5678
      AIVANTA_BRIDGE_URL: http://api:8000
      N8N_CREDENTIALS_CACHE: /data/objects/.n8n-credentials.json
    ports: ["8000:8000"]
    volumes: [objects:/data/objects]
    depends_on: { db: { condition: service_healthy }, n8n: { condition: service_started } }

  worker:                               # starts/resumes runs (it waits on n8n; the API serves the bridge)
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["python", "-m", "aivanta_api.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aivanta:aivanta@db:5432/aivanta
      STORAGE_DIR: /data/objects
      RUN_EXECUTION: worker
      N8N_MODE: rest
      N8N_API_URL: http://n8n:5678/api/v1
      N8N_WEBHOOK_URL: http://n8n:5678
      AIVANTA_BRIDGE_URL: http://api:8000
      N8N_CREDENTIALS_CACHE: /data/objects/.n8n-credentials.json
    volumes: [objects:/data/objects]
    depends_on: { db: { condition: service_healthy }, api: { condition: service_started } }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000", NEXT_PUBLIC_N8N_EDITOR_URL: "http://localhost:5678" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  n8ndata:
  n8nhome:
  objects:
